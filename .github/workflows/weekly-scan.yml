name: Relevé ChatGPT et Gemini

# Le 27 de chaque mois vers 5 h 30 à Paris, dernière semaine du mois, et à la demande depuis l'onglet
# Actions. Un relevé par mois suffit à mesurer les actions menées dans le mois.
# GitHub peut sauter un horaire planifié (affluence) : trois rattrapages suivent, qui ne relèvent que
# les clients pas encore relevés ces 3 derniers jours (--skip-done). Minutes décalées de l'heure pile, la plus chargée.
on:
  schedule:
    - cron: "23 4 27 * *"
    - cron: "23 8 27 * *"
    - cron: "23 13 27 * *"
    - cron: "23 4 28 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = résultats visibles dans la vue admin seulement · live = publiés dans le Cockpit"
        type: choice
        options: [test, live]
        default: test
      company:
        description: "Site du client (ex. dgco-fermetures.com), plusieurs séparés par des virgules. Vide = clients avec « Relevé automatique » activé."
        required: false

# Le robot lit le dépôt seulement : il écrit dans Supabase, jamais dans GitHub.
permissions:
  contents: read

concurrency:
  group: weekly-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Relevé
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Relevé
        # Le relevé planifié (mensuel) suit la variable SCAN_MODE (test tant qu'elle n'est pas passée à live).
        run: npx tsx scripts/scan.ts --mode="${MODE}" ${COMPANY:+--company="$COMPANY"} ${SKIP_DONE:+--skip-done}
        env:
          MODE: ${{ inputs.mode || vars.SCAN_MODE || 'test' }}
          COMPANY: ${{ inputs.company }}
          SKIP_DONE: ${{ github.event_name == 'schedule' && 'yes' || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_ANALYSIS_MODEL: ${{ vars.GEMINI_ANALYSIS_MODEL }}
          SCAN_RUNS: ${{ vars.SCAN_RUNS }}
